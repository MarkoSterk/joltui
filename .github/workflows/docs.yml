# Publishes the documentation to GitHub Pages (gh-pages branch, managed by mike).
#   push to main      -> the `dev` version
#   push of a v* tag  -> that minor version, and `latest` when it is the newest
# Pull requests only check that the site builds with --strict.
name: Documentation
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "scripts/docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: docs-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx zensical build --clean --strict

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish dev docs
        if: github.ref == 'refs/heads/main'
        run: bash scripts/publish_docs.sh --dev
      - name: Publish release docs
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/publish_docs.sh
